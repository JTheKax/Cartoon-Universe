name: Validate Cartoon Universe
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static site checks
        run: node scripts/check-site.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          if [ -f auth.js ]; then node --check auth.js; fi
      - name: Validate Cartoon Coin migration security contract
        run: node --test tests/cartoon-coins.test.mjs
      - name: Validate maintenance UI safety checks
        run: node --test tests/maintenance-ui.test.mjs
      - name: Validate maintenance JavaScript syntax
        run: |
          node --check maintenance-controls.js
          node --check maintenance-notice.js
      - name: Validate wallet JavaScript syntax
        run: node --check coin-wallet.js
  coin-database:
    name: Test Cartoon Coin database (isolated)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cartoon_coins_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cartoon_coins_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cartoon_coins_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable database fixture
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/ci_bootstrap.sql
      - name: Prepare isolated maintenance RLS fixture
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/maintenance_ci_fixture.sql
      - name: Test owner and nonowner maintenance permissions
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/maintenance_rls_test.sql
      - name: Apply proposed migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/maintenance-daily-reward-guard.sql
      - name: Verify maintenance reward blocking and owner bypass
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/maintenance_reward_guard_test.sql
      - name: Execute reward and RLS integration assertions
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/cartoon_coin_daily_reward_test.sql
      - name: Verify reward rollback after ledger failure
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/maintenance_reward_failure_test.sql
      - name: Verify overlapping reward claims award once
        timeout-minutes: 2
        run: python3 scripts/test-reward-concurrency.py
