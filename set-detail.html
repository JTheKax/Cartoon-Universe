<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sticker Set | Cartoon Universe</title><link rel="stylesheet" href="styles.css"><style>body{background:#07132c;color:#f5f8ff;font-family:system-ui,sans-serif}main{max-width:1050px;margin:3rem auto;padding:1.5rem}a{color:#7dd3fc}.notice{border:1px solid #38bdf8;background:#13274a;border-radius:12px;padding:1.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.card{background:#13274a;border:1px solid #38bdf8;border-radius:12px;padding:1rem}.muted{color:#b7c9e5}</style></head><body><main><a href="sets-overview.html">← Sets Overview</a><h1 id="heading">Sticker Set</h1><p id="status" class="notice" role="status">Loading set details…</p><div id="results" class="grid"></div></main><script>
const params=new URLSearchParams(location.search),series=params.get('series')||'',subseries=params.get('subseries')||'',heading=document.getElementById('heading'),status=document.getElementById('status'),results=document.getElementById('results');heading.textContent=subseries||series||'Sticker Set';
function card(title,description){const node=document.createElement('article');node.className='card';const h=document.createElement('h2');h.textContent=title;h.style.fontSize='1.1rem';const p=document.createElement('p');p.className='muted';p.textContent=description;node.append(h,p);results.append(node)}
if(!series){status.textContent='No set selected. Return to Sets Overview.'}
else if(series==='Video Games'){fetch('data/console-cartoon-anime-game-sets.draft.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()}).then(data=>{const sets=(data.sets||[]).filter(x=>!subseries||x.series===subseries);status.textContent='Draft video game catalog. These are game titles, not published sticker records. Player ownership is not yet connected.';for(const set of sets){card(set.series,(set.games||[]).join(' · ')||'Games coming soon')}if(!sets.length)status.textContent='No matching draft set found.'}).catch(()=>{status.textContent='Video game catalog could not be loaded.'})}
else{status.textContent='This series is listed in Sets Overview. Individual sticker records and authenticated Owned / Need status are not connected in this preview. No inventory has been changed.'}
</script></body></html>
