name: Owner maintenance switch isolated tests
on:
  pull_request:
    paths:
      - 'server/maintenance-switch-*.mjs'
      - 'server/maintenance-control-handler*.mjs'
      - '.github/workflows/maintenance-switch-isolated.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed switch policy and preview tests
        run: node --test server/maintenance-switch-policy.test.mjs server/maintenance-switch-preview.test.mjs server/maintenance-control-handler.test.mjs
