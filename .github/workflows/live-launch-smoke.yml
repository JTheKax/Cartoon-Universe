name: Live launch smoke (anonymous, read-only)
on:
  pull_request:
    branches: [review/production-public-gateway-20261028]
    paths:
      - 'scripts/live-launch-smoke.mjs'
      - 'tests/live-launch-smoke.test.mjs'
      - '.github/workflows/live-launch-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/live-launch-smoke.mjs
      - run: node --test tests/live-launch-smoke.test.mjs
  anonymous-live-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check redirect, public pages, owner denial, and source protection
        run: node scripts/live-launch-smoke.mjs
