<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16102f"><title>Cartoon Universe Accounts</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account.css"></head><body><header class="header"><a class="brand" href="index.html">🪐 CARTOON <span>UNIVERSE</span></a><nav style="display:flex"><a href="index.html">← Home</a></nav></header><main class="account-wrap"><h1 id="auth-heading">WELCOME BACK</h1><p class="eyebrow">CARTOON UNIVERSE · SECURE ACCOUNT ACCESS</p><p id="notice" role="status" aria-live="polite" hidden></p><section id="auth-forms"><div class="switch" id="login-actions"><button type="button" data-show="forgot">Forgot password?</button></div><form id="login" data-form="login"><h2>Welcome back</h2><label>Email<input id="login-email" type="email" autocomplete="email" required></label><label>Password<input id="login-password" type="password" autocomplete="current-password" required></label><button type="submit">Log in</button></form><form id="signup" data-form="signup" hidden><h2>Create an account</h2><label>Username<input id="signup-username" maxlength="20" minlength="3" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" required></label><label>Email<input id="signup-email" type="email" autocomplete="email" required></label><label>Password (12+ characters)<input id="signup-password" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Register</button></form><form id="forgot" data-form="forgot" hidden><h2>Reset password</h2><label>Email<input id="forgot-email" type="email" autocomplete="email" required></label><button type="submit">Email reset link</button></form><form id="password-update" data-form="password-update" hidden><h2>Set new password</h2><label>New password<input id="new-password" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Update password</button></form></section><section id="account-panel" hidden><h2>Your profile</h2><p><strong id="account-username"></strong> · <span id="account-role"></span></p><p id="account-email"></p><form id="profile"><label>Username<input id="profile-username" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required></label><label>Display name<input id="profile-name" maxlength="40"></label><label>Avatar color<select id="profile-color"><option value="#ff4ca8">Pink</option><option value="#54f4ff">Cyan</option><option value="#ffe15c">Yellow</option><option value="#a78bfa">Purple</option></select></label><button type="submit">Save profile</button></form><button id="logout">Log out</button></section></main><footer>Cartoon Universe 3.0</footer><script type="module" src="auth.js"></script></body></html>
