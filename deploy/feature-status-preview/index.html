<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartoon Universe — Feature Status (Review Preview)</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#10162a;color:#f6f8ff;font:1rem/1.5 system-ui,sans-serif;margin:0;padding:2rem}main{max-width:760px;margin:auto}h1{margin-bottom:.25rem}p{color:#c8d3e9}ul{list-style:none;padding:0}li{background:#19223b;border:1px solid #34415f;border-radius:12px;padding:1rem;margin:.75rem 0;display:flex;justify-content:space-between;gap:1rem;align-items:center}strong{font-size:.8rem;letter-spacing:.04em}.maintenance{color:#ffcf87}.unknown{color:#d5deef}.live{color:#91efbd}a{color:#bbd6ff}nav{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.5rem 0}nav a{background:#19223b;border:1px solid #34415f;padding:.6rem .8rem;border-radius:10px;text-decoration:none}.feature-badge{font-size:.7rem;font-weight:700;margin-left:.4rem}.feature-badge.unknown{color:#d5deef}.feature-badge.live{color:#91efbd}.feature-badge.maintenance{color:#ffcf87}small{display:block;color:#c8d3e9;margin-top:1.5rem}</style></head>
<body><main><h1>Cartoon Universe Feature Status</h1><p>Check which areas are available. This is a review-only preview, not a live status feed.</p><div id="feature-nav"></div><h2>All feature statuses</h2><ul id="features"></ul><small>Until server routing confirms a feature is available, its status is shown as UNKNOWN. This preview never claims that a feature is live.</small></main>
<script type="module">
import {resolvePublicFeatureStatus} from './public-feature-status.mjs';
import {createFeatureNavigation} from './feature-navigation.mjs';
document.getElementById('feature-nav').append(createFeatureNavigation(document));
const list=document.getElementById('features');
for(const item of resolvePublicFeatureStatus()){
 const row=document.createElement('li');const name=document.createElement('span');name.textContent=item.label;
 const status=document.createElement('strong');status.textContent=item.status;status.className=item.status.toLowerCase();
 row.append(name,status);list.append(row);
}
</script></body></html>
