<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Redeem Codes • Cartoon Universe</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070d20;color:#fff;font:16px system-ui;background-image:linear-gradient(#12305c66 1px,transparent 1px),linear-gradient(90deg,#12305c66 1px,transparent 1px);background-size:48px 48px}main{box-sizing:border-box;width:min(92vw,480px);padding:30px;border:2px solid #29aaff;border-radius:18px;background:#08142b;box-shadow:0 0 30px #0985ff66;text-align:center}h1{color:#66ceff;text-shadow:0 0 12px #0099ff}input,button{box-sizing:border-box;width:100%;padding:15px;margin-top:16px;border-radius:9px;font-size:17px}input{background:#050b1b;border:1px solid #5d8fb7;color:#fff;text-transform:uppercase}button{background:#1688ee;border:0;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}small{color:#b0c5df}#status{min-height:1.5em;color:#ffcf73}</style></head><body><main><h1>🎟️ REDEEM CODE</h1><p>Unlock Cartoon Universe rewards!</p><form id="form"><label for="code">Your promotional code</label><input id="code" maxlength="40" pattern="[A-Za-z0-9-]{3,40}" autocomplete="off" placeholder="ENTER CODE" required><button type="submit">REDEEM</button></form><p id="status" role="status" aria-live="polite"></p><small>Preview only. No codes or rewards are active yet.</small></main><script>document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const c=document.querySelector('#code').value.trim().toUpperCase();document.querySelector('#status').textContent=/^[A-Z0-9-]{3,40}$/.test(c)?'Code format accepted. Redemption server is not connected yet.':'Enter a valid code (3–40 letters, numbers or hyphens).';});</script></body></html>
