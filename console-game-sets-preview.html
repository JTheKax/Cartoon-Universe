<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Game Sets | Cartoon Universe 3.0 Preview</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080f25;color:#edf6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#080f25,#102f50);min-height:100vh}main{max-width:1100px;margin:auto;padding:30px 18px}a{color:#8deaff}.eyebrow{color:#7defff;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem}h1{margin:.2em 0}p{line-height:1.5}.notice{background:#182c48;border:1px solid #44718e;border-radius:12px;padding:12px 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}input,select{background:#091a2c;color:white;border:1px solid #6596b6;border-radius:9px;padding:12px;font:inherit}input{flex:1;min-width:220px}.group{margin:32px 0}h2{border-bottom:1px solid #456783;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{background:#122641;border:1px solid #345c80;border-radius:15px;padding:17px}.card h3{margin:0 0 8px;color:#a9eaff}.game{padding:10px 0;border-top:1px solid #35516d}.game small{display:block;color:#bdccdd;margin-top:5px}.pill{font-size:.75rem;border:1px solid #6387a5;border-radius:30px;padding:3px 8px;display:inline-block;margin-top:7px}button{cursor:pointer;background:#1d527b;border:1px solid #7dcaff;color:white;border-radius:8px;padding:7px 10px;margin-top:8px}button:hover{background:#286f9e}.muted{color:#bfd0e0}
</style></head><body><main>
<a href="index.html">← Cartoon Universe</a><p class="eyebrow">Collect / Sets Overview / Video Games</p>
<h1>Cartoon & Anime Console Games</h1>
<p class="notice"><strong>Development preview:</strong> Only console and handheld game adaptations. Artwork and actual ownership records are not connected yet. All stickers display <strong>Need</strong> as a preview placeholder, not as a saved player status.</p>
<div class="toolbar"><input id="search" type="search" placeholder="Search series or games" aria-label="Search series or games"><select id="category" aria-label="Filter category"><option value="all">All categories</option><option value="cartoon">Cartoons</option><option value="anime">Anime</option></select></div>
<p id="count" class="muted" aria-live="polite"></p><div id="results"></div>
</main><script>
const root=document.getElementById('results'),search=document.getElementById('search'),category=document.getElementById('category'),count=document.getElementById('count');let sets=[];
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function render(){root.replaceChildren();const q=search.value.trim().toLocaleLowerCase();const filtered=sets.filter(s=>(category.value==='all'||s.category===category.value)&&(s.series.toLocaleLowerCase().includes(q)||s.games.some(g=>g.toLocaleLowerCase().includes(q))));count.textContent=filtered.length+' series · '+filtered.reduce((n,s)=>n+s.games.length,0)+' example game entries';
for(const kind of ['cartoon','anime']){const entries=filtered.filter(s=>s.category===kind);if(!entries.length)continue;const section=el('section',undefined,'group');section.append(el('h2',kind==='cartoon'?'Cartoon Console Games':'Anime Console Games'));const grid=el('div',undefined,'grid');for(const item of entries){const card=el('article',undefined,'card');card.append(el('h3',item.series));for(const game of item.games){const gameBox=el('div',undefined,'game');gameBox.append(el('strong',game),el('small','Game artwork: Coming Soon'),el('span','Need · preview only','pill'));card.append(gameBox)}grid.append(card)}section.append(grid);root.append(section)}if(!filtered.length)root.append(el('p','No matching game series found.'))}
Promise.all([fetch('data/console-cartoon-anime-game-sets.draft.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()})]).then(([data])=>{sets=data.sets||[];render()}).catch(()=>{count.textContent='Unable to load the draft catalog. Please retry later.'});search.addEventListener('input',render);category.addEventListener('change',render);
</script></body></html>
