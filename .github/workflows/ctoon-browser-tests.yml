name: Ctoon browser tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/sticker-shop-catalog-preview-20261029
    paths:
      - 'sticker-catalog.json'
      - 'shop-collect-series.*'
      - 'assets/logos/**'
      - 'tests/browser/**'
      - '.github/workflows/ctoon-browser-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ctoon-server.log 2>&1 &
      - name: Test collection pages and logos
        run: node tests/browser/ctoon-check.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctoon-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
