<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartoon Universe Fighters</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d22;color:#f5f8ff;font:16px system-ui;text-align:center}h1{font-size:clamp(24px,5vw,42px);color:#72e9ff;text-shadow:3px 3px #b331f9}main{max-width:1000px;margin:auto;padding:12px}canvas{width:100%;image-rendering:pixelated;border:5px solid #62dcff;background:#14152e}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px}button{background:#20295a;color:white;border:2px solid #71eaff;padding:13px 16px;font-weight:700;touch-action:none}p{color:#bfc7ee}</style></head>
<body><main><h1>⚡ CARTOON UNIVERSE FIGHTERS ⚡</h1><canvas id="arena" width="800" height="450" aria-label="Fighting game arena"></canvas><p id="status" aria-live="polite">Round 1 — Fight!</p><p>A/D Move · W Jump · J Punch · K Kick · L Block · R Restart</p><div class="controls"><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">Jump</button><button data-key="j">Punch</button><button data-key="k">Kick</button><button data-key="l">Block</button><button id="restart">Restart</button></div></main>
<script>
const c=document.getElementById('arena'),ctx=c.getContext('2d'),status=document.getElementById('status');ctx.imageSmoothingEnabled=false;
const keys=new Set();let p,cpu,ended=false,last=0;
function fighter(x,color){return {x,y:340,vy:0,hp:100,color,facing:1,cooldown:0,attack:0,blocking:false};}
function reset(){p=fighter(170,'#46dcff');cpu=fighter(590,'#ff658e');ended=false;status.textContent='Round 1 — Fight!';}reset();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if('adwjklr'.includes(k)){e.preventDefault();keys.add(k);if(k==='r')reset();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k));});document.getElementById('restart').onclick=reset;addEventListener('blur',()=>keys.clear());
function strike(a,b,range,damage){if(a.cooldown>0||ended)return;a.cooldown=range===74?34:22;a.attack=12;if(Math.abs(a.x-b.x)<range&&Math.abs(a.y-b.y)<55&&Math.sign(b.x-a.x)===a.facing){b.hp=Math.max(0,b.hp-(b.blocking?Math.ceil(damage*.2):damage));if(!b.blocking)b.x=Math.max(30,Math.min(770,b.x+a.facing*13));if(b.hp===0){ended=true;status.textContent=b===cpu?'YOU WIN!':'CPU WINS!';}}}
function physics(f){f.vy+=.7;f.y=Math.min(340,f.y+f.vy);if(f.y===340)f.vy=0;f.x=Math.max(25,Math.min(775,f.x));f.cooldown=Math.max(0,f.cooldown-1);f.attack=Math.max(0,f.attack-1);}
function update(){if(ended)return;p.facing=cpu.x>=p.x?1:-1;cpu.facing=-p.facing;p.blocking=keys.has('l');if(!p.blocking){if(keys.has('a'))p.x-=3.6;if(keys.has('d'))p.x+=3.6;if(keys.has('w')&&p.y===340)p.vy=-12;if(keys.has('j'))strike(p,cpu,58,7);if(keys.has('k'))strike(p,cpu,74,11);}
const distance=Math.abs(cpu.x-p.x);cpu.blocking=distance<80&&p.attack>0&&Math.random()<.12;if(distance>65)cpu.x+=cpu.facing*1.75;else if(!cpu.blocking&&cpu.cooldown===0)strike(cpu,p,65,6);if(cpu.y===340&&p.y<300&&Math.random()<.025)cpu.vy=-11;physics(p);physics(cpu);}
function drawFighter(f){ctx.save();ctx.translate(Math.round(f.x),Math.round(f.y));ctx.scale(f.facing,1);ctx.fillStyle='#11182c';ctx.fillRect(-18,0,36,10);ctx.fillStyle=f.color;ctx.fillRect(-16,-70,32,42);ctx.fillRect(-17,-28,13,28);ctx.fillRect(4,-28,13,28);ctx.fillStyle='#ffdbad';ctx.fillRect(-14,-102,28,31);ctx.fillStyle='#15162d';ctx.fillRect(3,-91,6,5);ctx.fillStyle=f.blocking?'#f6d75e':f.color;ctx.fillRect(15,-65,f.attack?32:13,14);ctx.fillStyle='#fff';ctx.fillRect(-12,-109,24,7);ctx.restore();}
function draw(){ctx.fillStyle='#0e102a';ctx.fillRect(0,0,800,450);ctx.fillStyle='#192b54';for(let i=0;i<800;i+=65)ctx.fillRect(i,140+(i*13%90),48,240);ctx.fillStyle='#f34ac7';ctx.fillRect(0,352,800,5);ctx.fillStyle='#1d2851';ctx.fillRect(0,357,800,93);ctx.strokeStyle='#3f7baf';for(let i=0;i<800;i+=50){ctx.beginPath();ctx.moveTo(i,357);ctx.lineTo(400+(i-400)*1.7,450);ctx.stroke();}ctx.fillStyle='#26335b';ctx.fillRect(22,20,320,26);ctx.fillRect(458,20,320,26);ctx.fillStyle='#43e5f2';ctx.fillRect(25,23,314*p.hp/100,20);ctx.fillStyle='#ff5e8b';ctx.fillRect(461,23,314*cpu.hp/100,20);ctx.fillStyle='white';ctx.font='bold 17px monospace';ctx.fillText('PLAYER',24,68);ctx.fillText('CPU',734,68);drawFighter(p);drawFighter(cpu);}
function loop(t){if(t-last>=1000/60){update();draw();last=t;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
