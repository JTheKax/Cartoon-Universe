<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartoon Universe 3.0 — Navigation Preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#19377a,#060d25 62%);color:#e9f7ff;font:16px system-ui;min-height:100vh}header,main{max-width:1150px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(24px,4vw,40px);text-shadow:0 0 18px #00caff}small{color:#90b9d8}.tag{border:1px solid #65d6ff;padding:8px;border-radius:8px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:#071735;border-block:2px solid #1c78ac;justify-content:center}button{background:#112c54;border:1px solid #39a8ee;border-radius:8px;padding:13px;color:#fff;cursor:pointer;font-weight:700}button:hover,button:focus-visible,button.active{background:#126ba5;box-shadow:0 0 15px #1cc9fa}button[hidden]{display:none}section{border:1px solid #256d9e;border-radius:18px;padding:25px;background:#081934db;margin-top:24px}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}a.tile{display:block;background:#12315c;border:1px solid #389cce;border-radius:10px;padding:22px;color:#e8faff;text-decoration:none}a.tile:hover{background:#18578c}p{line-height:1.6}.grid{position:fixed;inset:60% 0 0;z-index:-1;opacity:.2;background-image:linear-gradient(#24baf7 1px,transparent 1px),linear-gradient(90deg,#24baf7 1px,transparent 1px);background-size:48px 48px;transform:perspective(300px) rotateX(35deg);pointer-events:none}</style></head><body><div class="grid"></div><header><div><h1>⚡ CARTOON UNIVERSE 3.0</h1><small>NEW ARCADE NAVIGATION • CONCEPT PREVIEW</small></div><span class="tag">NONPRODUCTION</span></header><nav id="nav" aria-label="Main navigation"></nav><main><section><h2 id="heading">Games</h2><p id="description">Choose an arcade destination.</p><div id="items"></div></section><p>Preview-only links do not access protected production pages. Owner mode below simulates menu visibility, not authentication.</p><label><input id="owner" type="checkbox"> Simulate owner navigation (preview only)</label></main><script>
const menus=[{"name":"Home","items":["Announcements","New Releases","Coming Soon"]},{"name":"Games","items":["Monster Catcher","Monster Catcher 2","Racing","Fighting","Retro Games","Arcade","Claw Machine","Prize Wheel"]},{"name":"Collect","items":["Sets Overview","My Collection","My Scene","Encyclopedia","Wishlist"]},{"name":"Shop","items":["Sticker Store","Yu-Gi-Oh! Card Shop","Auction","Recycler","Trading"]},{"name":"Cards","items":["Battle","Deck Builder"]},{"name":"Watch","items":[]},{"name":"Community","items":["Messages","Forums","Support","Help"]},{"name":"Account","items":["Login / Log Out","Register","Profile","Redeem Codes"]},{"name":"Admin","items":["Dashboard","Advertisements","Logos","Themes","Maintenance","Coin Management","Theater Management"]}];const nav=document.getElementById('nav'),items=document.getElementById('items'),heading=document.getElementById('heading'),description=document.getElementById('description'),owner=document.getElementById('owner');
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function select(name){const menu=menus.find(m=>m.name===name);if(!menu||name==='Admin'&&!owner.checked)return;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.name===name));heading.textContent=name==='Watch'?'Movie Theater':name;description.textContent=name==='Watch'?'Watch is a direct destination with no dropdown.':name==='Admin'?'Owner-only controls (visibility simulated in this preview).':'Choose a page from the '+name+' dropdown.';items.replaceChildren();const pages=name==='Watch'?['Movie Theater']:menu.items;for(const label of pages){const a=document.createElement('a');a.className='tile';a.textContent=label+' ↗';a.href='#'+slug(label);a.addEventListener('click',e=>{e.preventDefault();description.textContent=label+' — destination preview only; this page is not yet connected.'});items.append(a)}}
for(const menu of menus){const b=document.createElement('button');b.type='button';b.textContent=menu.name+(menu.items.length?' ▾':'');b.dataset.name=menu.name;b.hidden=menu.name==='Admin';b.addEventListener('click',()=>select(menu.name));nav.append(b)}
owner.addEventListener('change',()=>{nav.querySelector('[data-name="Admin"]').hidden=!owner.checked;if(!owner.checked&&heading.textContent==='Admin')select('Home')});select('Games');
</script></body></html>
