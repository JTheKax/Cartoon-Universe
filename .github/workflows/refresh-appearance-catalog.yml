name: Refresh appearance catalog (review only)
on:
  push:
    branches: [review/clean-arcade-ui]
    paths:
      - 'assets/logos/**'
      - 'assets/themes/**'
      - 'scripts/build_appearance_catalog.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build appearance catalog
        run: python scripts/build_appearance_catalog.py
      - name: Commit changed catalog to review branch
        run: |
          if ! git diff --quiet -- assets/appearance-catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/appearance-catalog.json
            git commit -m "chore: refresh appearance catalog"
            git push
          fi
