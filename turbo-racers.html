<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Racers | Cartoon Universe</title><style>*{box-sizing:border-box}body{margin:0;background:#10162d;color:#fff;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:14px}h1{color:#ffdb55;margin:8px}canvas{display:block;width:min(100%,720px);aspect-ratio:3/2;margin:10px auto;border:5px solid #facc15;border-radius:12px;background:#43864a;touch-action:none}select{background:#24375b;color:#fff;border:2px solid #facc15;border-radius:7px;padding:9px;margin:4px}#garage{background:#1a2542;border:1px solid #566a9d;border-radius:12px;padding:8px;margin:10px auto;max-width:720px}button{background:#24375b;color:white;border:2px solid #facc15;border-radius:8px;padding:12px 17px;font:inherit;margin:4px;cursor:pointer}button:focus-visible{outline:3px solid white}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.controls button{min-width:70px;touch-action:none}a{color:#ffdf63}#status{min-height:25px}</style></head><body><main><h1>🏎️ TURBO RACERS</h1><p>Cartoon Universe • Pixel Circuit</p><section id="garage"><h2>🏁 Race Setup</h2><label for="racer">Racer </label><select id="racer"><option value="0">Speedster • Red</option><option value="1">Blitz • Blue</option><option value="2">Leafster • Green</option><option value="3">Spark • Gold</option></select> <label for="course">Track </label><select id="course"><option value="0">Arcade Circuit</option><option value="1">Beach Blast</option><option value="2">City Rush</option><option value="3">Volcano Run</option></select><p id="record">Best time: —</p></section><p id="hud">Lap 1/3 • Position 1/4 • Time 0.0s</p><canvas id="track" width="600" height="400" aria-label="Top down kart racing circuit"></canvas><p id="status" role="status">Press Start Race!</p><button id="start">Start Race</button><button id="restart">Restart</button><div class="controls"><button data-control="left" aria-label="Steer left">◀</button><button data-control="accelerate" aria-label="Accelerate">▲ Gas</button><button data-control="brake" aria-label="Brake">▼ Brake</button><button data-control="right" aria-label="Steer right">▶</button></div><p>Keyboard: ← → steer, ↑ accelerate, ↓ brake. Touch: hold the buttons.</p><a href="index.html">← Back to Arcade</a></main><script>(()=>{'use strict';const canvas=document.getElementById('track'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud'),status=document.getElementById('status');const cx=300,cy=200,rx=242,ry=146,laps=3,keys=new Set(),colors=['#ff5b72','#5bc9ff','#65d68a','#ffe45e'],tracks=[{name:'Arcade Circuit',ground:'#398c49',inner:'#3e964b',road:'#424a59'},{name:'Beach Blast',ground:'#e4c87c',inner:'#68c7d6',road:'#657c8e'},{name:'City Rush',ground:'#343b65',inner:'#6571a0',road:'#404655'},{name:'Volcano Run',ground:'#74392d',inner:'#a84d29',road:'#37313d'}],racerSelect=document.getElementById('racer'),courseSelect=document.getElementById('course'),record=document.getElementById('record');let cars=[],running=false,finished=false,startTime=0,last=0,elapsed=0,raf=0;function reset(){racerSelect.disabled=false;courseSelect.disabled=false;const selected=Number(racerSelect.value);cars=[selected,...[0,1,2,3].filter(i=>i!==selected)].map((id,i)=>({color:colors[id],angle:-Math.PI/2-i*.17,progress:0,lap:1,speed:0,lane:i===0?0:(i-2)*11,ai:i!==0}));running=false;finished=false;elapsed=0;last=0;cancelAnimationFrame(raf);status.textContent='Press Start Race!';showRecord();render()}function showRecord(){try{const best=localStorage.getItem('cu-turbo-best-'+courseSelect.value);record.textContent='Best time: '+(best?Number(best).toFixed(1)+'s':'—')}catch{record.textContent='Best time: —'}}function begin(){reset();racerSelect.disabled=true;courseSelect.disabled=true;running=true;startTime=performance.now();last=startTime;status.textContent='GO! Finish 3 laps to win.';raf=requestAnimationFrame(frame)}function frame(t){if(!running)return;const dt=Math.min(.05,(t-last)/1000);last=t;elapsed=(t-startTime)/1000;const player=cars[0];const gas=keys.has('accelerate'),brake=keys.has('brake');player.speed=Math.max(0,Math.min(2.35,player.speed+(gas?1.7:brake?-3.1:-.65)*dt));const steering=(keys.has('left')?-1:0)+(keys.has('right')?1:0);player.lane=Math.max(-34,Math.min(34,player.lane+steering*85*dt));player.angle+=player.speed*dt;for(const car of cars.slice(1))car.angle+=(1.38+colors.indexOf(car.color)*.1)*dt;for(const car of cars){const turns=(car.angle+Math.PI/2)/(Math.PI*2);car.progress=Math.max(0,turns);car.lap=Math.min(laps,Math.floor(car.progress)+1)}const ranking=[...cars].sort((a,b)=>b.progress-a.progress);hud.textContent='Lap '+player.lap+'/'+laps+' • Position '+(ranking.indexOf(player)+1)+'/4 • Time '+elapsed.toFixed(1)+'s';if(player.progress>=laps){running=false;finished=true;racerSelect.disabled=false;courseSelect.disabled=false;try{const k='cu-turbo-best-'+courseSelect.value,old=Number(localStorage.getItem(k))||Infinity;if(elapsed<old)localStorage.setItem(k,String(elapsed))}catch{}showRecord();status.textContent='🏁 Finished in '+elapsed.toFixed(1)+' seconds! Position '+(ranking.indexOf(player)+1)+'/4';render();return}render();raf=requestAnimationFrame(frame)}function render(){ctx.clearRect(0,0,600,400);const theme=tracks[Number(courseSelect.value)];ctx.fillStyle=theme.ground;ctx.fillRect(0,0,600,400);for(let i=0;i<55;i++){const x=(i*113)%600,y=(i*71)%400;ctx.fillStyle=i%2?theme.inner:theme.ground;ctx.fillRect(x,y,8,8)}ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#dedede';ctx.beginPath();ctx.ellipse(0,0,rx+48,ry+48,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=theme.road;ctx.beginPath();ctx.ellipse(0,0,rx+36,ry+36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=theme.inner;ctx.beginPath();ctx.ellipse(0,0,rx-36,ry-36,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f9db64';ctx.lineWidth=3;ctx.setLineDash([14,14]);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#fff':'#111';ctx.fillRect(-8+i*2,-ry-36,2,72)}ctx.restore();for(const car of cars){const a=car.angle,x=cx+(rx+car.lane)*Math.cos(a),y=cy+(ry+car.lane)*Math.sin(a);ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.fillStyle='#111827';ctx.fillRect(-12,-9,5,7);ctx.fillRect(7,-9,5,7);ctx.fillRect(-12,4,5,7);ctx.fillRect(7,4,5,7);ctx.fillStyle=car.color;ctx.fillRect(-9,-14,18,28);ctx.fillStyle='#1d3557';ctx.fillRect(-6,-6,12,9);ctx.fillStyle='#fff';ctx.fillRect(-6,-13,4,3);ctx.fillRect(2,-13,4,3);ctx.restore()}ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.fillText(theme.name.toUpperCase(),215,192);ctx.font='12px system-ui';ctx.fillText('3 LAP GRAND PRIX',246,211);if(!running){ctx.fillStyle='#0009';ctx.fillRect(145,300,310,42);ctx.fillStyle='#fff';ctx.font='bold 19px system-ui';ctx.fillText(finished?'RACE COMPLETE!':'READY TO RACE?',218,327)}}racerSelect.addEventListener('change',()=>{if(!running)reset()});courseSelect.addEventListener('change',()=>{if(!running)reset()});document.getElementById('start').addEventListener('click',begin);document.getElementById('restart').addEventListener('click',reset);const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'accelerate',ArrowDown:'brake',a:'left',d:'right',w:'accelerate',s:'brake'};document.addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys.add(map[e.key])}});document.addEventListener('keyup',e=>{if(map[e.key])keys.delete(map[e.key])});window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-control]').forEach(b=>{const k=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k))});reset()})();</script></body></html>
