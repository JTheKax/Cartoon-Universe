name: Live launch smoke (anonymous, read-only)
on:
  pull_request:
    branches: [review/production-public-gateway-20261028]
    paths:
      - 'scripts/live-launch-smoke.mjs'
      - 'tests/**'
      - 'server/**'
      - '.github/workflows/live-launch-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/live-launch-smoke.mjs
      - run: node --test tests/live-launch-smoke.test.mjs
  anonymous-live-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check redirect, public pages, owner denial, and source protection
        run: node scripts/live-launch-smoke.mjs
  website-gateway-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static site links and references
        run: node scripts/check-site.mjs
      - name: Run isolated gateway, owner, CSP, and Coin contracts
        run: node --test tests/public-launch-gateway.test.mjs tests/owner-verification.test.mjs tests/release-csp-contract.test.mjs tests/cartoon-coins.test.mjs
