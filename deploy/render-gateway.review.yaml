# REVIEW ONLY: not connected to a Blueprint; do not sync or deploy this file yet.
# This defines a NEW service, not the existing cartoon-universe static service.
# Startup remains disabled. No database, migrations, old-site routing, or domains.
services:
  - type: web
    name: cartoon-universe-gateway-candidate
    runtime: node
    repo: https://github.com/JTheKax/Cartoon-Universe
    branch: main
    plan: free
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: node --check server/production-maintenance-gateway.mjs
    startCommand: node server/production-maintenance-gateway.mjs
    healthCheckPath: /__maintenance/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PRODUCTION_GATEWAY_ENABLED
        value: 'false'
      - key: PRODUCTION_SUPABASE_URL
        value: https://gjfyemvcrgrthbrlqqnz.supabase.co
      - key: PRODUCTION_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PRODUCTION_SITE_ORIGIN
        sync: false
