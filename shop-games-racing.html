<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartoon Universe Racing</title><style>body{margin:0;background:#100d22;color:#fff;font-family:system-ui;text-align:center}header{padding:15px;background:#241341}a{color:#ffd85a}main{max-width:750px;margin:auto;padding:16px}canvas{display:block;width:100%;max-width:480px;margin:12px auto;background:#444;border:5px solid #e4b64b;border-radius:12px;touch-action:none}button{background:#e7b73c;border:0;border-radius:9px;padding:14px 24px;margin:5px;font-weight:bold;font-size:18px;cursor:pointer}.controls{display:flex;justify-content:center}p{color:#e0d9f5}</style></head><body><header><a href="index.html">← Cartoon Universe</a> · Games / Racing</header><main><h1>🏎️ Cartoon Universe Racing</h1><p>Dodge traffic, collect points, and beat your high score!</p><canvas id="race" width="480" height="600" aria-label="Racing game track"></canvas><div><button id="start">Start / Restart</button><button id="pause">Pause</button></div><div class="controls"><button id="left" aria-label="Steer left">◀</button><button id="right" aria-label="Steer right">▶</button></div><p id="status" role="status">Press Start to race. Use ← → or A/D, or touch buttons.</p></main><script>const c=document.getElementById('race'),g=c.getContext('2d'),status=document.getElementById('status');let player=216,traffic=[],score=0,frame=0,running=false,paused=false,last=0,raf=0;const keys={};function reset(){cancelAnimationFrame(raf);player=216;traffic=[];score=0;frame=0;last=0;running=true;paused=false;status.textContent='Race on!';raf=requestAnimationFrame(loop)}function car(x,y,color){g.fillStyle=color;g.fillRect(x+4,y,36,66);g.fillStyle='#111b32';g.fillRect(x+10,y+10,24,15);g.fillRect(x+10,y+40,24,15);g.fillStyle='#ffeb8a';g.fillRect(x+5,y+2,8,6);g.fillRect(x+31,y+2,8,6)}function draw(){g.fillStyle='#226344';g.fillRect(0,0,480,600);g.fillStyle='#353640';g.fillRect(70,0,340,600);g.fillStyle='#f9e5a0';g.fillRect(76,0,6,600);g.fillRect(398,0,6,600);g.fillStyle='#eee';for(let y=-70+(frame*6)%90;y<600;y+=90){g.fillRect(182,y,6,44);g.fillRect(294,y,6,44)}for(const t of traffic)car(t.x,t.y,'#f0445e');car(player,490,'#42d8ff');g.fillStyle='#fff';g.font='bold 23px system-ui';g.fillText('SCORE '+score,15,32);g.fillText('BEST '+(Number(localStorage.getItem('cu-racing-best'))||0),310,32)}function loop(ts){if(!running)return;if(!last)last=ts;let dt=Math.min((ts-last)/16.67,2);last=ts;if(!paused){frame+=dt;if(keys.ArrowLeft||keys.a||keys.A)player-=6*dt;if(keys.ArrowRight||keys.d||keys.D)player+=6*dt;player=Math.max(92,Math.min(344,player));if(Math.floor(frame/48)>Math.floor((frame-dt)/48)){traffic.push({x:[104,216,328][Math.floor(Math.random()*3)],y:-80})}for(const t of traffic)t.y+=(5+Math.min(score/15,5))*dt;traffic=traffic.filter(t=>{if(t.y>600){score++;return false}return true});if(traffic.some(t=>Math.abs(t.x-player)<38&&t.y<552&&t.y+66>490)){running=false;const best=Math.max(score,Number(localStorage.getItem('cu-racing-best'))||0);localStorage.setItem('cu-racing-best',best);status.textContent='Crash! Score: '+score+' · Best: '+best+' · Press Start to retry.'}}draw();if(running)raf=requestAnimationFrame(loop)}document.getElementById('start').onclick=reset;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;status.textContent=paused?'Paused':'Race on!'};document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&running){paused=!paused}});document.addEventListener('keyup',e=>{keys[e.key]=false});for(const [id,key] of [['left','ArrowLeft'],['right','ArrowRight']]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[key]=false})}draw();</script></body></html>
