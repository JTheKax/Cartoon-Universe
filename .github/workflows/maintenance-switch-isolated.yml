name: Owner maintenance switch isolated tests
on:
  pull_request:
    paths:
      - 'server/maintenance-switch-*.mjs'
      - 'server/maintenance-control-handler*.mjs'
      - 'server/owner-maintenance-preview-route*.mjs'
      - 'server/public-maintenance-router*.mjs'
      - 'server/public-maintenance-http*.mjs'
      - 'server/maintenance-feature-review.test.mjs server/owner-maintenance-settings-reader.test.mjs server/owner-maintenance-settings-e2e.test.mjs server/gateway-owner-settings-integration.test.mjs'
      - 'server/owner-maintenance-settings-reader*.mjs'
      - 'maintenance-feature-review.js'
      - 'owner.html'
      - 'deploy/feature-status-preview/**'
      - '.github/workflows/maintenance-switch-isolated.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed switch policy and preview tests
        run: node --test server/maintenance-switch-policy.test.mjs server/maintenance-switch-preview.test.mjs server/maintenance-control-handler.test.mjs server/owner-maintenance-preview-route.test.mjs deploy/feature-status-preview/public-feature-status.test.mjs deploy/feature-status-preview/feature-navigation.test.mjs server/public-maintenance-router.test.mjs server/public-maintenance-http.test.mjs server/public-maintenance-http-fixtures.test.mjs server/maintenance-feature-review.test.mjs
