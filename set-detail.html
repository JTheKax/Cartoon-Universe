<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sticker Set | Cartoon Universe</title><link rel="stylesheet" href="styles.css"><style>body{background:#07132c;color:#f5f8ff;font-family:system-ui,sans-serif}main{max-width:1050px;margin:3rem auto;padding:1.5rem}a{color:#7dd3fc}.notice{border:1px solid #38bdf8;background:#13274a;border-radius:12px;padding:1.2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}.card{background:#13274a;border:1px solid #38bdf8;border-radius:12px;padding:1rem}.muted{color:#b7c9e5}</style></head><body><main><a href="sets-overview.html">← Sets Overview</a><h1 id="heading">Sticker Set</h1><p id="status" class="notice" role="status">Loading set details…</p><div id="results" class="grid"></div></main><script>
const params = new URLSearchParams(location.search);
const series = params.get('series') || '';
const subseries = params.get('subseries') || '';
const heading = document.getElementById('heading');
const status = document.getElementById('status');
const results = document.getElementById('results');
heading.textContent = subseries || series || 'Sticker Set';
function card(title, description, href) {
  const node = document.createElement('article'); node.className = 'card';
  const h = document.createElement('h2'); h.textContent = title;
  const p = document.createElement('p'); p.className = 'muted'; p.textContent = description;
  node.append(h, p);
  if (href) { const link = document.createElement('a'); link.href = href; link.textContent = 'View series'; node.append(link); }
  results.append(node);
}
async function loadDetail() {
  if (!series) { status.textContent = 'No set selected. Return to Sets Overview.'; return; }
  try {
    const response = await fetch('data/ctoon-series-plan.json', {cache:'no-cache'});
    if (!response.ok) throw new Error('Catalog unavailable');
    const data = await response.json();
    const category = (data.categories || []).find(c => c.name === series);
    if (!category) { status.textContent = 'Set not found in the current catalog.'; return; }
    if (subseries && !category.series.includes(subseries)) {
      status.textContent = 'Series not found in this category.'; return;
    }
    if (subseries) {
      status.textContent = 'Coming Soon: sticker artwork and published Ctoon records for this series are being verified. Owned / Need counts are not available yet.';
    } else {
      status.textContent = category.series.length ? 'Choose a series below. Ownership progress will appear once authenticated collection records are connected.' : 'Coming Soon: no series have been published in this category yet.';
      for (const name of category.series) card(name, 'Sticker catalog pending verification', 'set-detail.html?series=' + encodeURIComponent(series) + '&subseries=' + encodeURIComponent(name));
    }
  } catch (error) { status.textContent = 'Could not load the series catalog. Please try again.'; console.error(error); }
}
loadDetail();
</script></body></html>
